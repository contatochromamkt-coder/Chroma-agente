<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Inter:wght@500;600;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1440px; overflow:hidden; }
</style>
</head>
<body>
<div style="width:1080px;height:1440px;background:linear-gradient(160deg,#0d0620,#1a0e3e 45%,#0a0a12);color:#fff;font-family:'Inter',sans-serif;display:flex;flex-direction:column;padding:72px;position:relative;overflow:hidden;">
  <div style="position:absolute;top:-120px;right:-120px;width:480px;height:480px;background:radial-gradient(circle,#7C3AED33,transparent 70%);pointer-events:none;"></div>
  <div style="position:absolute;bottom:-100px;left:-100px;width:400px;height:400px;background:radial-gradient(circle,#FF6B3533,transparent 70%);pointer-events:none;"></div>

  <div style="position:relative;z-index:1;">
    <div style="display:inline-block;background:#FF6B3533;border-radius:8px;padding:8px 20px;font-size:24px;color:#FF9A6B;font-weight:800;text-transform:uppercase;letter-spacing:3px;margin-bottom:28px;">Chroma Marketing</div>
    <h1 style="font-size:54px;font-weight:900;line-height:1.2;margin:0 0 24px 0;font-family:'Montserrat',sans-serif;">
      Sua empresa está <span style="background:linear-gradient(90deg,#FF6B35,#7C3AED);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">gritando</span> ou está sendo <span style="background:linear-gradient(90deg,#FF6B35,#7C3AED);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">lembrada</span>?
    </h1>
    <p style="font-size:34px;color:#c4bfd0;line-height:1.55;margin:0;font-weight:500;">Postar mais não é a resposta. Veja o que realmente move o resultado.</p>
  </div>

  <div style="position:relative;z-index:1;display:flex;flex-direction:column;gap:16px;margin:40px 0;flex:1;justify-content:center;">
    <div style="background:#ffffff08;border:1px solid #ffffff10;border-radius:16px;padding:28px 32px;display:flex;justify-content:space-between;align-items:center;">
      <span style="font-size:28px;color:#a89fb5;font-weight:500;">Posts por semana</span>
      <span style="font-size:40px;font-weight:800;color:#FF9A6B;font-family:'Montserrat',sans-serif;">5-7x</span>
    </div>
    <div style="background:#ffffff08;border:1px solid #ffffff10;border-radius:16px;padding:28px 32px;display:flex;justify-content:space-between;align-items:center;">
      <span style="font-size:28px;color:#a89fb5;font-weight:500;">Reach x Saves</span>
      <span style="font-size:40px;font-weight:800;color:#7C3AED;font-family:'Montserrat',sans-serif;">1.4x</span>
    </div>
    <div style="background:#ffffff08;border:1px solid #ffffff10;border-radius:16px;padding:28px 32px;display:flex;justify-content:space-between;align-items:center;">
      <span style="font-size:28px;color:#a89fb5;font-weight:500;">Comentários com CTA</span>
      <span style="font-size:40px;font-weight:800;color:#4ADE80;font-family:'Montserrat',sans-serif;">+2x</span>
    </div>
  </div>

  <div style="position:relative;z-index:1;display:flex;align-items:center;gap:20px;padding-top:24px;border-top:1px solid #ffffff12;">
    <div style="width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#FF6B35,#7C3AED);"></div>
    <span style="font-size:24px;color:#8a8395;">@chroma_mkt</span>
    <span style="margin-left:auto;font-size:24px;color:#665f70;">ARRASTE →</span>
  </div>
</div>
</body>
</html>
