  html, body { width:1080px; height:1080px; overflow:hidden; }
  body {
    position:relative;
    font-family:'Archivo', sans-serif;
    background: linear-gradient(160deg, #0d0618 0%, #1a0b33 45%, #050208 100%);
    color:#fff;
  }
  .glow {
    position:absolute;
    top:52%; left:50%;
    width:960px; height:960px;
    transform:translate(-50%,-50%);
    background: radial-gradient(circle, rgba(139,92,246,0.35) 0%, rgba(139,92,246,0.12) 40%, transparent 70%);
    z-index:0;
  }
  .frame {
    position:relative;
    z-index:2;
    width:1080px; height:1080px;
    padding:72px;
    display:flex;
    flex-direction:column;
  }
  .logo { width:220px; height:auto; display:block; }
  .intro {
    margin-top:44px;
    font-size:32px;
    font-weight:700;
    color:#C9C4D0;
    line-height:1.3;
    max-width:820px;
    text-transform:uppercase;
    letter-spacing:0.5px;
  }
  .headline {
    position:relative;
    z-index:3;
    margin-top:24px;
    font-family:'Anton', sans-serif;
    font-size:82px;
    line-height:0.96;
    text-transform:uppercase;
  }
  .headline .row { position:relative; display:block; white-space:nowrap; height:1em; }
  .word-shadow {
    position:absolute;
    top:0.10em; left:0.055em;
    z-index:0;
    font:inherit;
    white-space:nowrap;
  }
  .word-main { position:relative; z-index:1; font:inherit; white-space:nowrap; }
  .row.line1 .word-main { color:#FFFFFF; }
  .row.line1 .word-shadow { color:#050208; }
  .row.line2 .word-main {
    background: linear-gradient(135deg, #A855F7, #7C3AED);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .row.line2 .word-shadow { color:#3d1a5c; -webkit-text-fill-color:#3d1a5c; background:none; }

  .object-wrap {
    position:absolute;
    top:452px;
    left:50%;
    transform:translateX(-50%);
    width:640px;
    height:400px;
    z-index:1;
    pointer-events:none;
  }
  .object-wrap img {
    width:100%; height:100%;
    object-fit:contain;
    mix-blend-mode: screen;
    mask-image: radial-gradient(circle at center, black 40%, transparent 68%);
    -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 68%);
    filter: drop-shadow(0 30px 60px rgba(0,0,0,0.35));
  }

  .support {
    position:relative;
    z-index:4;
    margin-top:270px;
    margin-bottom:16px;
    font-size:34px;
    font-weight:500;
    color:#C9C4D0;
    line-height:1.45;
    max-width:900px;
  }
  .support strong { color:#fff; font-weight:700; }

  .cta {
    position:relative;
    z-index:4;
    display:inline-flex;
    align-self:flex-start;
    padding:24px 52px;
    border-radius:999px;
    background: linear-gradient(135deg, #A855F7, #7C3AED);
    color:#FFFFFF;
    font-weight:700;
    font-size:30px;
    box-shadow: 0 18px 40px rgba(124,58,237,0.45);
  }
