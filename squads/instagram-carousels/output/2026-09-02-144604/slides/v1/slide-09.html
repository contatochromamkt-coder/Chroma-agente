<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1440px; overflow:hidden; }
</style>
</head>
<body>
<div style="width:1080px;height:1440px;background:#141018;color:#fff;font-family:'Inter',sans-serif;display:flex;flex-direction:column;padding:72px;position:relative;overflow:hidden;">
  <div style="position:absolute;top:-140px;right:-140px;width:480px;height:480px;background:radial-gradient(circle,#FF3D6E33,transparent 70%);pointer-events:none;"></div>
  <div style="position:absolute;bottom:-120px;left:-120px;width:420px;height:420px;background:radial-gradient(circle,#7C4DFF2e,transparent 70%);pointer-events:none;"></div>
  <div style="position:relative;z-index:1;display:inline-flex;align-items:center;gap:16px;margin-bottom:40px;">
    <div style="width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#FF3D6E,#7C4DFF);"></div>
    <span style="font-size:28px;font-weight:700;color:#fff;">Chroma Marketing</span>
  </div>
  <div style="position:relative;z-index:1;flex:1;display:flex;flex-direction:column;justify-content:center;">
    <h1 style="font-size:58px;font-weight:800;line-height:1.3;margin:0 0 32px 0;">
      Comenta "<span style="color:#FF3D6E;">RETENÇÃO</span>" aqui embaixo que a gente te manda o checklist que usamos pra planejar conteúdo por retenção, não por calendário.
    </h1>
  </div>
  <div style="position:relative;z-index:1;margin-top:auto;display:flex;flex-direction:column;gap:16px;padding-top:24px;border-top:1px solid #ffffff22;">
    <div style="display:flex;align-items:center;">
      <span style="font-size:24px;color:#8a8590;">@chroma_mkt</span>
      <span style="margin-left:auto;font-size:24px;font-weight:700;color:#FF3D6E;">COMENTE →</span>
    </div>
    <span style="font-size:24px;color:#8a8590;">Chroma Marketing — gestão de redes sociais e conteúdo estratégico</span>
  </div>
</div>
</body>
</html>
