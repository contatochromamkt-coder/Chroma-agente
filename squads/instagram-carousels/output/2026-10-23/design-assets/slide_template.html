<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: 'Anton';
    src: url(data:font/woff2;base64,{{FONT_ANTON_400}}) format('woff2');
    font-weight: 400;
    font-style: normal;
  }
  @font-face {
    font-family: 'Archivo';
    src: url(data:font/woff2;base64,{{FONT_ARCHIVO_500}}) format('woff2');
    font-weight: 500;
    font-style: normal;
  }
  @font-face {
    font-family: 'Archivo';
    src: url(data:font/woff2;base64,{{FONT_ARCHIVO_600}}) format('woff2');
    font-weight: 600;
    font-style: normal;
  }
  @font-face {
    font-family: 'Archivo';
    src: url(data:font/woff2;base64,{{FONT_ARCHIVO_700}}) format('woff2');
    font-weight: 700;
    font-style: normal;
  }
  @font-face {
    font-family: 'Archivo';
    src: url(data:font/woff2;base64,{{FONT_ARCHIVO_800}}) format('woff2');
    font-weight: 800;
    font-style: normal;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:1080px; height:1080px; overflow:hidden;
    background: linear-gradient(160deg, #0d0618 0%, #1a0b33 45%, #050208 100%);
    font-family:'Archivo', sans-serif;
  }
  .frame {
    position:relative; width:1080px; height:1080px;
    padding:72px;
    display:flex; flex-direction:column;
  }
  .glow {
    position:absolute; top:-120px; left:50%; transform:translateX(-50%);
    width:900px; height:900px; border-radius:50%;
    background: radial-gradient(circle, rgba(139,92,246,0.38) 0%, rgba(139,92,246,0) 70%);
    z-index:0;
  }
  .logo { width:220px; height:auto; display:block; position:relative; z-index:2; }
  .intro {
    margin-top:36px;
    font-family:'Archivo'; font-weight:600; font-size:28px; color:#C9C4D0;
    letter-spacing:0.5px; text-transform:uppercase; position:relative; z-index:2;
  }
  .headline { margin-top:18px; position:relative; z-index:2; }
  .headline-line {
    position:relative;
    font-family:'Anton'; font-weight:400; font-size:88px; line-height:0.92;
    text-transform:uppercase; white-space:nowrap;
  }
  .headline-line .shadow {
    position:absolute; top:8px; left:4px; z-index:0; color:#050208;
  }
  .headline-line .main { position:relative; z-index:1; }
  .headline-line.white .main { color:#FFFFFF; }
  .headline-line.grad .main {
    background: linear-gradient(135deg, #A855F7, #7C3AED);
    -webkit-background-clip: text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .headline-line.grad .shadow { color:#3d1a5c; }
  .support {
    margin-top:110px; max-width:820px;
    font-family:'Archivo'; font-weight:500; font-size:34px; line-height:1.5; color:#C9C4D0;
    position:relative; z-index:2;
  }
  .object-wrap {
    position:absolute; z-index:1;
    width:620px; height:339px;
    top:156px; left:50%; transform:translateX(-50%);
    mask-image: radial-gradient(ellipse at center, black 48%, transparent 76%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 48%, transparent 76%);
    display:flex; align-items:center; justify-content:center;
  }
  .object-wrap img { width:100%; height:100%; object-fit:contain; }
  .cta-wrap {
    margin-top:auto; margin-bottom:20px; position:relative; z-index:3;
    display:flex; justify-content:flex-start;
  }
  .cta {
    display:inline-block;
    background: linear-gradient(135deg, #A855F7, #7C3AED);
    color:#FFFFFF; font-family:'Archivo'; font-weight:700; font-size:30px;
    padding:24px 48px; border-radius:999px;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="glow"></div>
    <img class="logo" src="data:image/png;base64,{{LOGO_B64}}" />
    <div class="intro">IBGE &middot; Pesquisa Mensal de Com&eacute;rcio</div>
    <div class="headline">
      <div class="headline-line white">
        <span class="shadow">O ZERO</span><span class="main">O ZERO</span>
      </div>
      <div class="headline-line grad">
        <span class="shadow">QUE ENGANA</span><span class="main">QUE ENGANA</span>
      </div>
    </div>
    <div class="support">Varejo cresceu s&oacute; 0,1% em agosto &mdash; mas inform&aacute;tica subiu 6,3% enquanto m&oacute;veis caiu 4,2%.</div>
    <div class="object-wrap"><img src="data:image/jpeg;base64,{{OBJECT_B64}}" /></div>
    <div class="cta-wrap"><div class="cta">Salva Isso</div></div>
  </div>
</body>
</html>
